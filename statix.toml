# statix config, consumed by the `statix` flake check in flake.nix.
#
# repeated_keys (W20) is deliberately off. It wants every `services.a.enable` /
# `services.b.enable` pair collapsed into a single `services = { ... }` block.
# That is a style opinion, not a correctness lint, and it argues against the
# dotted-path form that nixpkgs itself and every NixOS manual example use. Turning
# it on would mean restructuring most modules in this repo for zero behavioural
# change, and a gate you have to fight is a gate that gets switched off. Every
# other statix lint stays on and the repo is clean against them.
disabled = ["repeated_keys"]

# Generated by nixos-generate-config and overwritten wholesale whenever the
# hardware changes (see CLAUDE.md), so nothing here should be held to the repo's
# lint rules — a regeneration would break the build.
ignore = ["hosts/*/hardware-configuration.nix"]
